<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="A configurable, embeddable HarshMaps map powered by open map infrastructure.">
  <title>HarshMaps Embed</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css'">
  <link rel="stylesheet" href="./embed.css?v=20261026-1">
</head>
<body>
  <main id="map-shell" aria-label="HarshMaps embedded map">
    <div id="map" role="region" aria-label="Interactive map"></div>
    <form id="embed-search" class="floating-search" role="search">
      <label class="sr-only" for="place-query">Search for a place</label>
      <span aria-hidden="true">⌕</span>
      <input id="place-query" type="search" minlength="2" placeholder="Search a place…" autocomplete="off">
      <button type="submit" aria-label="Search places">↗</button>
    </form>
    <div class="floating-tools">
      <button id="toggle-places" type="button" title="Toggle points of interest" aria-label="Toggle points of interest" aria-pressed="true">✧</button>
      <button id="locate-button" type="button" title="Show my location" aria-label="Show my location">◎</button>
    </div>
    <div id="embed-status" class="status" role="status" aria-live="polite">Connecting to map…</div>
    <div id="map-loader" class="loader"><i></i><span>Loading map</span></div>
    <noscript>HarshMaps needs JavaScript enabled to display this interactive map.</noscript>
  </main>
  <script type="module" src="./embed.js?v=20261026-3"></script>
</body>
</html>
