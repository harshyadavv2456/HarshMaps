name: Test HarshMaps SDK
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check embed.js
      - run: node --check sdk/places-layer.js
      - run: node --check scripts/refresh-overture-release.mjs
      - run: npm test
