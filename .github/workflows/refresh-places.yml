name: Refresh Overture Places release pointer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-places.yml'
      - 'scripts/refresh-overture-release.mjs'
      - 'data/overture-release.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harshmaps-overture-release
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover latest Overture release
        run: node scripts/refresh-overture-release.mjs
      - name: Check whether release changed
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/overture-release.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit release pointer
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overture-release.json
          git commit -m "chore(data): update Overture Places release pointer"
          git push
      - name: Configure GitHub Pages
        if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload refreshed static site
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed static site
        if: steps.diff.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
