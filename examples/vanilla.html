<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarshMaps minimal embed</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css"><style>html,body{height:100%;margin:0;font-family:system-ui,sans-serif}#map{height:100%;width:100%}.label{position:absolute;z-index:2;top:12px;left:12px;padding:9px 12px;background:white;border-radius:8px;box-shadow:0 3px 20px #0002;font-size:12px}</style></head><body><div class="label">HarshMaps · minimal embed</div><div id="map"></div><script type="module">import * as ml from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';import {HarshMaps} from 'https://cdn.jsdelivr.net/gh/harshyadavv2456/HarshMaps@main/sdk/harshmaps.js';const map=HarshMaps.createMap(ml,'map',{center:[72.8777,19.076],zoom:10,style:HarshMaps.styles.liberty});map.on('load',()=>HarshMaps.addMarker(ml,map,[72.8777,19.076],{label:'Mumbai, India'}));</script></body></html>
